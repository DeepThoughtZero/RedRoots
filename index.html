<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RedRoots - Mars Game of Life</title>
    <!-- Tailwind CSS for rapid UI development -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mars: {
                            900: '#2A0A0A',
                            800: '#4A1515',
                            700: '#7A2222',
                            500: '#B23A3A',
                            300: '#E86A6A'
                        },
                        neon: {
                            cyan: '#00FFFF',
                            green: '#39FF14',
                            pink: '#FF00FF',
                            yellow: '#FFFF00'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Fira+Code:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-900 text-gray-100 overflow-hidden font-sans select-none">
    
    <!-- Background Effect -->
    <div class="fixed inset-0 z-[-1] mars-bg-gradient"></div>
    <div class="fixed inset-0 z-[-1] stars-bg opacity-30"></div>

    <!-- Main Application Container -->
    <div id="app" class="relative w-full h-screen flex flex-col">
        
        <!-- Top Bar: Game Info -->
        <header class="h-16 glass-panel border-b border-mars-800 flex items-center justify-between px-6 z-10 flex-shrink-0">
            <div class="flex items-center gap-4">
                <h1 class="text-2xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-400">
                    REDROOTS
                </h1>
                <span id="gamePhaseDisplay" class="px-3 py-1 bg-mars-800 rounded-full text-xs font-bold uppercase tracking-widest text-mars-300 shadow-inner">
                    Setup
                </span>
                <div id="simSpeedContainer" class="hidden flex items-center gap-2 ml-4">
                    <span class="text-xs text-gray-400 uppercase tracking-wide">Tempo:</span>
                    <input type="range" id="simSpeed" min="1" max="60" value="30" class="w-24 accent-neon-cyan">
                </div>
            </div>
            
            <div id="topStats" class="hidden flex items-center gap-6">
                <div class="flex flex-col items-center">
                    <span class="text-xs text-gray-400 uppercase tracking-wide">Runde</span>
                    <span id="roundDisplay" class="font-mono text-lg font-bold text-white">1 / 10</span>
                </div>
                <div class="w-px h-8 bg-gray-700"></div>
                <div class="flex items-center gap-2">
                    <span class="text-xs text-gray-400 uppercase tracking-wide">Aktueller Spieler:</span>
                    <span id="currentPlayerDisplay" class="font-bold text-lg drop-shadow-md">Player 1</span>
                </div>
            </div>
            
            <div>
                <button id="btnSettings" class="text-gray-400 hover:text-white transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 relative flex overflow-hidden">
            
            <!-- Start Menu Overlay (visible initially) -->
            <div id="startMenu" class="absolute inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm transition-opacity duration-300">
                <div class="glass-panel w-full max-w-2xl p-8 rounded-2xl shadow-2xl border border-white/10">
                    <h2 class="text-3xl font-bold mb-6 text-center text-white">Missions-Setup</h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Map Settings -->
                        <div class="space-y-4">
                            <h3 class="text-lg font-semibold text-mars-300 border-b border-mars-800 pb-2">Karte & Spiel</h3>
                            <div>
                                <label class="block text-sm text-gray-400 mb-1">Kartengröße</label>
                                <select id="cfgMapSize" class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-white">
                                    <option value="small">Klein (60x40)</option>
                                    <option value="medium" selected>Mittel (100x60)</option>
                                    <option value="large">Groß (140x80)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm text-gray-400 mb-1">Anzahl Runden</label>
                                <input type="number" id="cfgRounds" value="10" min="1" max="50" class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-white">
                            </div>
                            <div>
                                <label class="block text-sm text-gray-400 mb-1">Budget (Zellen pro Runde)</label>
                                <input type="number" id="cfgBudget" value="300" min="10" max="2000" step="10" class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-white">
                            </div>
                            <div>
                                <label class="block text-sm text-gray-400 mb-1">Evolutionsschritte pro Runde</label>
                                <input type="number" id="cfgSteps" value="500" min="100" max="2000" step="100" class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-white">
                            </div>
                        </div>

                        <!-- Mechanics Settings -->
                        <div class="space-y-4">
                            <h3 class="text-lg font-semibold text-mars-300 border-b border-mars-800 pb-2">Mechanik</h3>
                            <div>
                                <label class="block text-sm text-gray-400 mb-1">Spieleranzahl (Mensch + KI)</label>
                                <select id="cfgPlayerCount" class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-white">
                                    <option value="2" selected>2 Spieler</option>
                                    <option value="4">4 Spieler</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm text-gray-400 mb-1">Menschliche Spieler (Rest = KI)</label>
                                <input type="number" id="cfgHumans" value="1" min="0" max="4" class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-white">
                            </div>
                            <div>
                                <label class="block text-sm text-gray-400 mb-1">Gebiets-Radius (Zellen)</label>
                                <input type="number" id="cfgRadius" value="5" min="1" max="15" class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-white">
                            </div>
                            <div>
                                <label class="block text-sm text-gray-400 mb-1">Zellverschmelzung bei Konflikt</label>
                                <select id="cfgCollision" class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-white">
                                    <option value="majority" selected>Mehrheit gewinnt</option>
                                    <option value="neutral">Neutral (Niemandem)</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="mt-8 flex justify-center">
                        <button id="btnStartGame" class="bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-orange-500 text-white font-bold py-3 px-12 rounded-full shadow-[0_0_15px_rgba(239,68,68,0.5)] transition-all transform hover:scale-105">
                            Mission Starten
                        </button>
                    </div>
                </div>
            </div>

            <!-- Game Board (Canvas) -->
            <div id="canvasContainer" class="flex-1 relative cursor-crosshair overflow-hidden touch-none flex items-center justify-center p-4">
                <canvas id="gameCanvas" class="shadow-2xl rounded border border-white/5 bg-[#0a0a0a]"></canvas>
            </div>

            <!-- Right Panel: Placement Tools & Budget -->
            <aside id="rightPanel" class="w-72 glass-panel border-l border-mars-800 flex flex-col transition-transform duration-300 translate-x-full absolute right-0 top-0 bottom-0 z-20">
                <!-- Toggle Button (Tab) -->
                <button id="btnTogglePanel" class="absolute -left-10 top-1/2 -translate-y-1/2 w-10 h-24 glass-panel border-l border-t border-b border-mars-800 rounded-l-lg flex items-center justify-center text-gray-400 hover:text-white group">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 transform transition-transform group-hover:scale-110" fill="none" viewBox="0 0 24 24" stroke="currentColor" id="panelIcon">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>

                <!-- Panel Content -->
                <div class="flex-1 flex flex-col p-4 h-full overflow-y-auto">
                    
                    <!-- Player Status Header -->
                    <div id="panelPlayerHeader" class="mb-6 p-4 rounded-xl border border-white/10 bg-black/40 text-center">
                        <h3 class="text-lg font-bold" id="panelPlayerName">Warte auf Start</h3>
                        <div class="mt-2 text-sm text-gray-400">Budget</div>
                        <div class="text-3xl font-mono font-bold text-white drop-shadow-[0_0_8px_rgba(255,255,255,0.5)]" id="budgetDisplay">--</div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex gap-2 mb-6">
                        <button id="btnFinishTurn" class="flex-1 bg-green-600/80 hover:bg-green-500 text-white font-bold py-2 px-4 rounded transition shadow-[0_0_10px_rgba(34,197,94,0.3)]">
                            Zug Beenden
                        </button>
                    </div>

                    <!-- Tools Section -->
                    <h4 class="text-sm font-semibold text-mars-300 uppercase tracking-wider mb-3">Figuren (Kosten = Zellen)</h4>
                    
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs text-gray-400">R: Rotieren, Rechtsklick: Rotieren</span>
                        <button id="btnRotate" class="p-1.5 bg-gray-800 hover:bg-gray-700 rounded text-gray-300 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                            </svg>
                        </button>
                    </div>

                    <div id="patternList" class="space-y-2 flex-1">
                        <!-- Populated dynamically via JS -->
                    </div>
                </div>
            </aside>

        </main>
        
        <!-- Bottom Banner / Event Log (Optional) -->
        <footer id="eventLog" class="h-8 glass-panel border-t border-mars-800 flex items-center justify-center text-xs text-gray-400 tracking-widest uppercase z-10 flex-shrink-0">
            System bereit.
        </footer>
    </div>

    <!-- Alert Overlay -->
    <div id="alertOverlay" class="fixed inset-0 z-[100] flex items-center justify-center pointer-events-none opacity-0 transition-opacity duration-300">
        <div class="bg-black/80 backdrop-blur-md border-t-4 border-b-4 border-red-500 py-6 px-12 transform scale-95 transition-transform duration-300 flex flex-col items-center" id="alertBox">
            <h2 id="alertTitle" class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-500 text-center uppercase tracking-widest drop-shadow-[0_0_10px_rgba(239,68,68,0.8)]">ALERT</h2>
            <p id="alertMessage" class="text-xl text-gray-300 mt-2 mb-6 text-center">Message goes here</p>
            <button id="btnRestartGame" class="bg-gray-800 hover:bg-gray-700 text-white font-bold py-2 px-6 rounded border border-gray-600 transition shadow-[0_0_10px_rgba(255,255,255,0.1)]">
                Neues Spiel starten
            </button>
        </div>
    </div>

    <!-- Load Scripts in order -->
    <script src="js/utils/Constants.js"></script>
    <script src="js/core/Territory.js"></script>
    <script src="js/core/Grid.js"></script>
    <script src="js/core/AI.js"></script>
    <script src="js/core/InputHandler.js"></script>
    <script src="js/core/GameState.js"></script>
    <script src="js/ui/GameRenderer.js"></script>
    <script src="js/ui/UIManager.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
